version: 0.2

phases:
  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - echo "Starting Docker build"

  build:
    commands:
      - docker build -t simpledockerservice .

  post_build:
    commands:
      - echo "Docker build completed"

artifacts:
  files:
    - '**/*'
